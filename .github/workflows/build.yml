# Development builds: a tarball of the Meson install tree and a Flatpak
# bundle, attached to one rolling pre-release rather than published as a
# release per version.
#
# The tarball builds in Arch because the app wants libadwaita 1.9, which the
# Ubuntu images do not carry. The Flatpak builds against
# org.gnome.Platform//51, whose GTK 4.24, libadwaita 1.9 and JavaScriptCore 6
# take the place of the distribution packages, and bundles no engine.
#
# The version lives in Cargo.toml only (AGENTS.md invariant 8), and every push
# to `main` builds the same unreleased version, so the artifact names carry the
# commit too: `<version>.r<commits since the tag>.g<sha>`, the same string the
# AUR -git recipe builds (packaging/aur/PKGBUILD `pkgver`).
#
# The two build jobs hand their files to `publish` through workflow artifacts,
# because a job cannot read another job's filesystem. `publish` is what makes
# the release: it replaces the `snapshot` pre-release on every non-pull-request
# run, so the Releases page carries one pair of files for the newest commit
# instead of one artifact set per run.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One place names the build for the two build jobs, so their files cannot
  # disagree about what they contain.
  version:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.read.outputs.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` needs the tag and the history behind it
      - id: read
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          # `v0.4.0-33-g58972eb` -> `0.4.0.r33.g58972eb`; a clone whose tag is
          # missing falls back to the commit count and the short sha.
          if describe=$(git describe --tags --long --match "v$version" 2>/dev/null); then
            label=$(echo "$describe" | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
          else
            label="$version.r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version; artifacts are named puzzle-timer-$label-*"

  tarball:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git rust gtk4 libadwaita webkitgtk-6.0 pkgconf \
            blueprint-compiler gettext meson ninja binutils

      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --locked

      - name: Build and package the install tree
        run: |
          label="${{ needs.version.outputs.label }}"
          meson setup builddir --buildtype=release --prefix=/usr
          DESTDIR="$PWD/stage/puzzle-timer" meson install -C builddir
          strip --strip-unneeded stage/puzzle-timer/usr/bin/puzzle-timer
          tar -C stage -czf "puzzle-timer-$label-x86_64.tar.gz" puzzle-timer
          sha256sum "puzzle-timer-$label-x86_64.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: puzzle-timer-${{ needs.version.outputs.label }}-x86_64
          path: |
            puzzle-timer-*.tar.gz
            SHA256SUMS

  flatpak:
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # The action builds the bundle and uploads it as an artifact itself. Its
      # default artifact name appends the architecture to the bundle name,
      # which here already carries it (`…-x86_64-x86_64.flatpak`), so both are
      # given explicitly.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: puzzle-timer-${{ needs.version.outputs.label }}-x86_64.flatpak
          artifact-name: puzzle-timer-${{ needs.version.outputs.label }}-flatpak
          manifest-path: packaging/flatpak/io.github.xlucn.PuzzleTimer.json
          cache-key: flatpak-${{ github.sha }}

  # The release. Both build jobs must finish first, so this waits for their
  # files; a pull request still builds but must not touch the release.
  publish:
    needs: [version, tarball, flatpak]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and replace the release
      actions: read # read this run's artifacts
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Replace the snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          label="${{ needs.version.outputs.label }}"

          # The release is a single unversioned snapshot, so its assets are
          # named without the version or the commit: a script can fetch
          # .../releases/download/snapshot/puzzle-timer-x86_64.flatpak forever.
          # The label stays in the title and the notes instead.
          mkdir -p out
          mv dist/puzzle-timer-*-x86_64.tar.gz out/puzzle-timer-x86_64.tar.gz
          mv dist/puzzle-timer-*-x86_64.flatpak out/puzzle-timer-x86_64.flatpak
          (cd out && sha256sum puzzle-timer-* > SHA256SUMS)

          {
            echo "Automatic development build of \`${GITHUB_SHA:0:7}\` ($label), replaced on every push."
            echo
            echo "- \`puzzle-timer-x86_64.tar.gz\` — the files it installs into \`/usr\`"
            echo "- \`puzzle-timer-x86_64.flatpak\` — \`flatpak install --user --bundle <file>\`"
            echo
            echo "A development build, not a release: it may be broken and carries no changelog."
          } > notes.md

          # Dropping the release and its tag first keeps exactly one set of
          # assets, and recreating it moves the tag onto this commit.
          gh release delete snapshot --cleanup-tag --yes 2>/dev/null || true
          gh release create snapshot out/* \
            --target "$GITHUB_SHA" \
            --title "Development snapshot — $label" \
            --prerelease --latest=false \
            --notes-file notes.md
