# Development builds: a tarball of the Meson install tree and a Flatpak
# bundle for x86_64 and aarch64, attached to one rolling pre-release rather
# than published as a release per version.
#
# Both architectures build natively. The tarball builds on Ubuntu 26.04, whose
# GTK 4.22, libadwaita 1.9 and JavaScriptCore 6 are what the app needs; the
# Flatpak builds inside org.gnome.Platform//51, whose newer libraries take the
# place of the distribution packages and bundle no engine. No Arch container is
# involved and nothing is cross-compiled: `ubuntu-26.04-arm` is an arm64
# machine.
#
# The version lives in Cargo.toml only (AGENTS.md invariant 8), and every push
# to `main` builds the same unreleased version, so the artifact names carry the
# commit too: `<version>.r<commits since the tag>.g<sha>`, the same string the
# AUR -git recipe builds (packaging/aur/PKGBUILD `pkgver`). A development build
# also gets `-nightly` in its file names and stamps that label as its own
# version, so it is not mistaken for the release whose number it follows; a
# `v*` tag build keeps the plain version and no marker.
#
# The build jobs hand their files to `publish` through workflow artifacts,
# because a job cannot read another job's filesystem. Two jobs then make
# releases: `publish` replaces the `snapshot` pre-release on every push to a
# branch, and `release` turns a `v*` tag into a real release whose notes are
# that version's CHANGELOG section.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One place names the build for the build jobs, so their files cannot
  # disagree about what they contain.
  version:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.read.outputs.label }}
      version: ${{ steps.read.outputs.version }}
      suffix: ${{ steps.read.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `git describe` needs the tag and the history behind it
      - id: read
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          # `v0.4.0-33-g58972eb` -> `0.4.0.r33.g58972eb`; a clone whose tag is
          # missing falls back to the commit count and the short sha.
          if describe=$(git describe --tags --long --match "v$version" 2>/dev/null); then
            label=$(echo "$describe" | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
          else
            label="$version.r$(git rev-list --count HEAD).g$(git rev-parse --short HEAD)"
          fi
          # Only a tag is a release. Everything else is a development build, and
          # says so in its file names and in the version it reports.
          case "$GITHUB_REF" in
            refs/tags/v*) suffix="" ;;
            *) suffix="-nightly" ;;
          esac
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml says $version; artifacts are named puzzle-timer-$label$suffix-*"

  tarball:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            blueprint-compiler desktop-file-utils gettext gtk-update-icon-cache \
            libadwaita-1-dev libgtk-4-dev libjavascriptcoregtk-6.0-dev \
            meson ninja-build pkg-config rustc cargo

      - uses: actions/checkout@v7

      - name: Test
        run: cargo test --locked

      - name: Build and package the install tree
        run: |
          label="${{ needs.version.outputs.label }}"
          arch="${{ matrix.arch }}"
          suffix="${{ needs.version.outputs.suffix }}"
          # A development build reports the label as its version; a tag build
          # keeps Cargo.toml's, which is the release's name.
          if [ -n "$suffix" ]; then
            export PUZZLE_TIMER_VERSION="$label"
          fi
          meson setup builddir --buildtype=release --prefix=/usr
          DESTDIR="$PWD/stage/puzzle-timer" meson install -C builddir
          strip --strip-unneeded stage/puzzle-timer/usr/bin/puzzle-timer
          tar -C stage -czf "puzzle-timer-$label$suffix-$arch.tar.gz" puzzle-timer

      - uses: actions/upload-artifact@v7
        with:
          name: puzzle-timer-${{ needs.version.outputs.label }}${{ needs.version.outputs.suffix }}-${{ matrix.arch }}
          path: puzzle-timer-*.tar.gz

  flatpak:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
          - runner: ubuntu-26.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # flatpak-builder has no `--env`, so a development build's label goes
      # into the manifest's build-options for this run only. Inserting before
      # the existing key keeps the JSON valid whatever follows it.
      - name: Stamp the nightly version
        if: needs.version.outputs.suffix != ''
        run: |
          manifest=packaging/flatpak/io.github.xlucn.PuzzleTimer.json
          version="${{ needs.version.outputs.label }}"
          sed -i "/\"CARGO_HOME\":/i\\      \"PUZZLE_TIMER_VERSION\": \"$version\"," "$manifest"
          grep -q "\"PUZZLE_TIMER_VERSION\": \"$version\"" "$manifest"
          cat "$manifest"

      # The action builds the bundle and uploads it as an artifact itself. Its
      # default artifact name appends the architecture to the bundle name,
      # which here already carries it (`…-x86_64-x86_64.flatpak`), so both are
      # given explicitly.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: puzzle-timer-${{ needs.version.outputs.label }}${{ needs.version.outputs.suffix }}-${{ matrix.arch }}.flatpak
          artifact-name: puzzle-timer-${{ needs.version.outputs.label }}${{ needs.version.outputs.suffix }}-flatpak-${{ matrix.arch }}
          manifest-path: packaging/flatpak/io.github.xlucn.PuzzleTimer.json
          arch: ${{ matrix.arch }}
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}

  # The rolling pre-release. Every build job must finish first, so this waits
  # for their files; a pull request still builds but must not touch it, and a
  # version tag goes to `release` instead.
  publish:
    needs: [version, tarball, flatpak]
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and replace the release
      actions: read # read this run's artifacts
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Replace the snapshot pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          label="${{ needs.version.outputs.label }}"
          suffix="${{ needs.version.outputs.suffix }}"

          # The release is a single unversioned snapshot, so its assets are
          # named without the version or the commit: a script can fetch
          # .../releases/download/snapshot/puzzle-timer-nightly-x86_64.flatpak
          # forever. The label stays in the title and the notes instead.
          mkdir -p out
          for arch in x86_64 aarch64; do
            mv "dist/puzzle-timer-$label$suffix-$arch.tar.gz" "out/puzzle-timer$suffix-$arch.tar.gz"
            mv "dist/puzzle-timer-$label$suffix-$arch.flatpak" "out/puzzle-timer$suffix-$arch.flatpak"
          done
          (cd out && sha256sum puzzle-timer-* > SHA256SUMS)

          {
            echo "Automatic development build of \`${GITHUB_SHA:0:7}\` ($label), replaced on every push."
            echo
            echo "The app reports its version as \`$label\`, and its files carry \`-nightly\` so they are not taken for a release."
            echo
            echo "- \`puzzle-timer$suffix-x86_64.tar.gz\` and \`puzzle-timer$suffix-aarch64.tar.gz\` — the files they install into \`/usr\`"
            echo "- \`puzzle-timer$suffix-x86_64.flatpak\` and \`puzzle-timer$suffix-aarch64.flatpak\` — \`flatpak install --user --bundle <file>\`"
            echo
            echo "A development build, not a release: it may be broken and carries no changelog."
          } > notes.md

          # Dropping the release and its tag first keeps exactly one set of
          # assets, and recreating it moves the tag onto this commit.
          gh release delete snapshot --cleanup-tag --yes 2>/dev/null || true
          gh release create snapshot out/* \
            --target "$GITHUB_SHA" \
            --title "Development snapshot — $label" \
            --prerelease --latest=false \
            --notes-file notes.md

  # A `v*` tag: the same files, named after the version, with that version's
  # CHANGELOG section as the notes.
  release:
    needs: [version, tarball, flatpak]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7 # CHANGELOG.md becomes the notes
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ needs.version.outputs.version }}"
          label="${{ needs.version.outputs.label }}"
          suffix="${{ needs.version.outputs.suffix }}"
          tag="${{ github.ref_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not name Cargo.toml's $version" >&2
            exit 1
          fi

          # The changelog entries are written for users; `--generate-notes`
          # would publish commit subjects instead.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > body.md
          sed -i '/./,$!d' body.md # drop the blank line under the heading
          if ! grep -q '[^[:space:]]' body.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          mkdir -p out
          for arch in x86_64 aarch64; do
            mv "dist/puzzle-timer-$label$suffix-$arch.tar.gz" "out/puzzle-timer-$version-$arch.tar.gz"
            mv "dist/puzzle-timer-$label$suffix-$arch.flatpak" "out/puzzle-timer-$version-$arch.flatpak"
          done
          (cd out && sha256sum puzzle-timer-* > SHA256SUMS)

          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the same tag replaces the files and the text instead
            # of failing on a release that already exists.
            gh release upload "$tag" out/* --clobber
            gh release edit "$tag" --title "Puzzle Timer $version" --notes-file body.md
          else
            gh release create "$tag" out/* \
              --title "Puzzle Timer $version" \
              --notes-file body.md \
              --verify-tag \
              --latest
          fi
