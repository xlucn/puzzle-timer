[package]
name = "probe-v8"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "probe-v8"
path = "src/main.rs"

[dependencies]
probe-common = { path = "../probe-common" }
# The `v8` crate *is* rusty_v8 — deno_core's own name for it on crates.io.
# Same artifact deno_core links (librusty_v8.a), none of deno_core on top.
v8 = "150"
