[package]
name = "puzzle-timer"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A native GTK4/libadwaita speedcubing timer — WCA scrambles for 206 puzzles, sessions and statistics, in the spirit of csTimer."
license = "GPL-3.0-or-later"
repository = "https://github.com/xlucn/puzzle-timer"
homepage = "https://github.com/xlucn/puzzle-timer#readme"

[lib]
name = "puzzle_timer"
path = "src/lib.rs"

[[bin]]
name = "puzzle-timer"
path = "src/main.rs"

[[bin]]
name = "scramble_sweep"
path = "src/bin/scramble_sweep.rs"

# JSC is the default engine: the executable links the system library and stays
# small. A V8 backend (the `v8` crate) is the alternative; see src/scramble/.
[dependencies]
gtk4 = { version = "0.11", features = ["v4_24"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
glib = "0.22"
# The scramble worker answers the UI over an async channel the main loop polls;
# glib 0.22 no longer carries its own channel.
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session ids fold accents out of names (NFKD, like the v0.3.0 app).
unicode-normalization = "0.1"
# Local calendar days use the C library's localtime_r/mktime, the same
# algorithm JavaScript's Date gave the v0.3.0 app; no time-zone database is
# parsed in process and no crate is added for it.
libc = "0.2"
# OS entropy for the scramble seed: explicit CSPRNG rather than cstimer_module's
# wall-clock fallback.
getrandom = "0.3"
